          return;
        }
        if (key !== "w") executeTackle(activePlayer(), key === "x");
      }

      function endCharge(key) {
        if (!state.charge || state.charge.key !== key) return;
        const charge = state.charge;
        const player = playerById(charge.playerId);
        state.charge = null;
        if (charge.mode === "setPieceShot") {
          const setup = state.setPiece;
          if (!player || !setup || setup.takerId !== player.id || state.phase !== "setpiece") {
            say("EL TIRO LIBRE YA NO ESTÁ DISPONIBLE", 1);
            return;
          }
          const hold = Math.min(1, (performance.now() - charge.started) / charge.max);
          const goalX = setup.side === 0 ? field.right + 8 : field.left - 8;
          const aim = aimDirection(player);
          const targetY = clamp(setup.y + aim.y * 120, field.goalTop + 10, field.goalBottom - 10);
          const directionX = goalX - setup.x;
          const directionY = targetY - setup.y;
          const power = 7.2 + hold * 3.5;
          const label = setup.kind === "PENAL" ? "PENAL" : "TIRO LIBRE";
          player.x = setup.x;
          player.y = setup.y;
          player.dirX = setup.side === 0 ? 1 : -1;
          player.trickPose = "TIRO";
          player.trickPoseUntil = performance.now() + 520;
          state.phase = "play";
          state.setPiece = null;
          launchBall(player, directionX, directionY, power, 2.4 + hold * 2.1, label);
          say("¡" + label + "!", 1.2);
          return;
        }
        if (!player || state.ball.owner !== player.id) {
          say("PERDISTE EL BALÓN ANTES DE SOLTAR", 0.9);
          return;
        }
        const heldFor = Math.min(1, (performance.now() - charge.started) / charge.max);
        if (charge.mode === "shot") shoot(player, 9.2, "TIRO", 0.35, heldFor);
        else if (charge.mode === "diagonalPass") {
          const aerial = performance.now() - charge.started >= 320;
          pass(player, aerial ? "aerial" : "diagonal", heldFor);
        }
        else {
          pass(player, "short", heldFor);
        }
      }

      function switchPlayer() {
        const teammates = ownPlayers();
        const index = teammates.findIndex(teammate => teammate.id === state.selected);
        state.selected = teammates[(index + 1) % teammates.length].id;
        state.swap = 0.2;
        state.charge = null;
        say("JUGADOR " + (playerById(state.selected).index + 1), 0.7);
      }

      function roundedRect(x, y, w, h, r, fill, stroke) {
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, r);
        ctx.fillStyle = fill;
        ctx.fill();
        if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
      }

      function drawField() {
        ctx.fillStyle = "#172628";
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = "#263837";
        for (let x = 0; x < W; x += 32) ctx.fillRect(x, 0, 16, H);
        ctx.fillStyle = "#527d48";
        ctx.fillRect(field.left, field.top, field.right - field.left, field.bottom - field.top);
        const stripeH = (field.bottom - field.top) / 8;
        for (let i = 0; i < 8; i += 2) {
          ctx.fillStyle = "#59844c";
          ctx.fillRect(field.left, field.top + i * stripeH, field.right - field.left, stripeH);
        }
        ctx.strokeStyle = "#d5e5b2";
        ctx.lineWidth = 2;
        ctx.strokeRect(field.left, field.top, field.right - field.left, field.bottom - field.top);
        ctx.beginPath();
        ctx.moveTo(480, field.top); ctx.lineTo(480, field.bottom);
        ctx.stroke();
        ctx.beginPath();
        ctx.ellipse(480, 270, 67, 42, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = "#e8efcf"; ctx.fillRect(477, 267, 6, 6);
        for (const goal of [{ x: field.left - 24 }, { x: field.right }]) {
          ctx.fillStyle = "#b6c8af";
          ctx.fillRect(goal.x, field.goalTop, 24, field.goalBottom - field.goalTop);
          ctx.strokeStyle = "#e8e5c8";
          ctx.lineWidth = 2;
          ctx.strokeRect(goal.x, field.goalTop, 24, field.goalBottom - field.goalTop);
          ctx.strokeStyle = "#b4c2a2";
          ctx.lineWidth = 1;
          for (let y = field.goalTop + 12; y < field.goalBottom; y += 12) {
            ctx.beginPath(); ctx.moveTo(goal.x, y); ctx.lineTo(goal.x + 24, y); ctx.stroke();
          }
          ctx.beginPath(); ctx.moveTo(goal.x + 8, field.goalTop); ctx.lineTo(goal.x + 8, field.goalBottom); ctx.stroke();
        }
        ctx.strokeRect(field.left, 170, 82, 200);
        ctx.strokeRect(field.left, 210, 36, 120);
        ctx.strokeRect(field.right - 82, 170, 82, 200);
        ctx.strokeRect(field.right - 36, 210, 36, 120);
        ctx.beginPath(); ctx.ellipse(field.left + 82, 270, 4, 3, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(field.right - 82, 270, 4, 3, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#d8f36a";
        ctx.font = "bold 12px Courier New";
        ctx.textAlign = "center";
        ctx.fillText("CANCHA BRAVA", 480, 60);
      }

      function drawPlayer(player) {
        const palette = colors[player.side];
        const pose = player.trickPose || "";
        const slidePose = pose === "BARRIDA" && player.trickPoseUntil > performance.now();
        const slideProgress = slidePose
          ? clamp(1 - (player.trickPoseUntil - performance.now()) / 760, 0, 1)
          : 0;
        const spinProgress = pose === "RULETA" && player.trickPoseStartedAt
          ? clamp((performance.now() - player.trickPoseStartedAt) / (player.trickPoseDuration || 700), 0, 1)
          : 0;
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.scale(1.12, 1.12);
        ctx.translate(-player.x, -player.y);
        const takingGoalKick = state.setPiece && state.setPiece.kind === "SAQUE DE ARCO" && state.setPiece.takerId === player.id;
        const isGoalkeeper = player.goalkeeper || takingGoalKick;
        const shirtColor = isGoalkeeper ? (player.side === 0 ? "#f2ce45" : "#be7af4") : palette.shirt;
        const selected = player.id === state.selected && player.side === 0;
        const shadowY = player.y + 8;
        if (selected) {
          ctx.strokeStyle = "#e7ff83";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.ellipse(player.x, player.y + 1, 17, 12, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.fillStyle = "#e7ff83";
          ctx.beginPath();
          ctx.moveTo(player.x - 4, player.y - 20); ctx.lineTo(player.x + 4, player.y - 20);
          ctx.lineTo(player.x, player.y - 14); ctx.fill();
        }
        ctx.fillStyle = "#10191888";
        ctx.beginPath(); ctx.ellipse(player.x + 2, shadowY + 2, 12, 7, 0, 0, Math.PI * 2); ctx.fill();
        if (slidePose) {
          const fade = 1 - slideProgress;
          ctx.save();
          ctx.globalAlpha = fade * 0.7;
          ctx.strokeStyle = player.side === 0 ? "#d7f4d0" : "#f4c89a";
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(player.x - player.dirX * 38, player.y - player.dirY * 38 + 7);
          ctx.lineTo(player.x - player.dirX * 12, player.y - player.dirY * 12 + 7);
          ctx.stroke();
          ctx.fillStyle = "#e9d7a0";
          for (let dust = 0; dust < 4; dust++) {
            const offset = dust * 7;
            const px = player.x - player.dirX * (24 + offset) + player.dirY * (dust % 2 ? 8 : -8);
            const py = player.y - player.dirY * (24 + offset) - player.dirX * (dust % 2 ? 8 : -8) + 5;
            ctx.fillRect(Math.round(px), Math.round(py), 3, 3);
          }
          ctx.restore();
        }
        if (Math.hypot(player.vx, player.vy) > 80) {
          ctx.save();
          ctx.globalAlpha = 0.3;
          ctx.strokeStyle = palette.glow;
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(player.x - player.vx * 0.085, player.y - player.vy * 0.085);
          ctx.lineTo(player.x - player.vx * 0.15, player.y - player.vy * 0.15);
          ctx.stroke();
          ctx.restore();
        }
        if (player.action > 0) {
          const intensity = player.action / 0.72;
          ctx.save();
          ctx.globalAlpha = intensity;
          ctx.strokeStyle = player.side === 0 ? "#eaff76" : "#ffd27b";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(player.x, player.y, 17 + (1 - intensity) * 15, -1.1, 1.1);
          ctx.stroke();
          ctx.strokeStyle = palette.glow;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(player.x, player.y, 22 + (1 - intensity) * 11, 2.1, 3.5);
          ctx.stroke();
          for (let spark = 0; spark < 3; spark++) {
            const angle = Math.atan2(player.dirY, player.dirX) + (spark - 1) * 0.58;
            const reach = 24 + (1 - intensity) * 12;
            const sx = player.x + Math.cos(angle) * reach;
            const sy = player.y + Math.sin(angle) * reach;
            ctx.fillStyle = spark === 1 ? "#fff5a8" : palette.glow;
            ctx.fillRect(Math.round(sx) - 2, Math.round(sy) - 2, 4, 4);
          }
          ctx.restore();
        }
        ctx.save();
        if (slidePose) {
          ctx.translate(player.x, player.y);
          ctx.rotate(Math.atan2(player.dirY, player.dirX) - Math.PI / 2);
          ctx.scale(1, 0.72);
          ctx.translate(-player.x, -player.y);
        }
        const pace = Math.hypot(player.vx, player.vy);
        const stride = pace > 25 ? Math.sin(state.motionTime * 17 + player.id) * 4 : 0;
        const bicycleLift = pose.startsWith("BICICLETA") ? 9 + Math.abs(Math.sin(state.motionTime * 20)) * 5 : 0;
        const elasticSweep = pose === "ELASTICA" || pose === "ELASTICA_ARMED" ? Math.sin(state.motionTime * 18) * 8 : 0;
        const hookSweep = pose === "ENGANCHE" ? 7 : 0;
        const rouletteShift = pose === "RULETA" ? Math.sin(spinProgress * Math.PI * 2) * 7 : 0;
        const volleyKick = pose === "VOLEA" ? 12 + Math.sin(state.motionTime * 20) * 3 : 0;
        const shotKick = pose === "TIRO" ? 9 + Math.sin(state.motionTime * 18) * 2 : 0;
        const bicycleKick = pose === "CHILENA" ? 15 + Math.sin(state.motionTime * 16) * 4 : 0;
        const rabonaKick = pose === "RABONA" || pose === "PASE_RABONA" ? 10 : 0;
        const heelKick = pose === "TACONAZO" || pose === "PASE_TACO" ? 8 : 0;
        const passSweep = pose === "PASE_DIAGONAL" ? 7 : pose === "PASE_RASO" ? 4 : pose === "PASE_AEREO" || pose === "PASE_ARQUERO" ? 9 : pose === "PASE" ? 5 : 0;
        const shoulderSwing = pose === "HOMBRO" ? 9 : 0;
        const chipKick = pose === "VASELINA" ? 11 : 0;
        const rabonaMotion = pose === "RABONA" || pose === "PASE_RABONA" ? 9 + Math.abs(Math.sin(state.motionTime * 18)) * 3 : 0;
        const heelMotion = pose === "TACONAZO" || pose === "PASE_TACO" ? 7 + Math.abs(Math.sin(state.motionTime * 17)) * 3 : 0;
        const chestControl = pose === "CONTROL_PECHO" ? 5 : 0;
        const footControl = pose === "CONTROL_PIE" ? 8 + Math.abs(Math.sin(state.motionTime * 16)) * 3 : 0;
        const heelControl = pose === "CONTROL_TALON" ? 9 + Math.abs(Math.sin(state.motionTime * 16)) * 2 : 0;
        const chestBounce = pose === "CONTROL_PECHO" ? 4 + Math.abs(Math.sin(state.motionTime * 14)) * 3 : 0;
        ctx.lineCap = "square";
        ctx.lineWidth = 4;
        ctx.strokeStyle = player.side === 0 ? "#173c42" : "#532821";
        ctx.beginPath();
        const leftLegSwing = pose === "BICICLETA_IZQUIERDA" ? -bicycleLift : pose === "BICICLETA_DERECHA" ? bicycleLift : elasticSweep + hookSweep + rouletteShift + stride + volleyKick + shotKick - bicycleKick + rabonaMotion + heelMotion + passSweep + chipKick + footControl - heelControl;
        const rightLegSwing = pose === "BICICLETA_DERECHA" ? -bicycleLift : pose === "BICICLETA_IZQUIERDA" ? bicycleLift : -elasticSweep + hookSweep - rouletteShift - stride - volleyKick - shotKick + bicycleKick - rabonaMotion + heelMotion - passSweep - chipKick - footControl + heelControl;
        const kickHeight = Math.max(bicycleLift, volleyKick, shotKick, bicycleKick, footControl, chestBounce);
        ctx.moveTo(player.x - 4, player.y + 6); ctx.lineTo(player.x - 6 + leftLegSwing, player.y + 14 - kickHeight);
        ctx.moveTo(player.x + 4, player.y + 6); ctx.lineTo(player.x + 6 + rightLegSwing, player.y + 14 - kickHeight);
        ctx.stroke();
        const animatedPose = slidePose || pose.startsWith("BICICLETA") || pose.startsWith("CONTROL_READY") || ["ELASTICA", "ELASTICA_ARMED", "ENGANCHE", "RULETA", "TIRO", "VOLEA", "CHILENA", "RABONA", "TACONAZO", "PASE", "PASE_DIAGONAL", "PASE_AEREO", "PASE_ARQUERO", "PASE_RASO", "PASE_RABONA", "PASE_TACO", "HOMBRO", "VASELINA", "CONTROL_PIE", "CONTROL_PECHO", "CONTROL_TALON"].includes(pose);
        if (animatedPose) {
          ctx.fillStyle = "#e8c39b";
          ctx.fillRect(Math.round(player.x - 8 + leftLegSwing), Math.round(player.y + 12 - kickHeight), 6, 4);
          ctx.fillRect(Math.round(player.x + 3 + rightLegSwing), Math.round(player.y + 12 - kickHeight), 6, 4);
          ctx.save();
          ctx.globalAlpha = 0.75;
          ctx.strokeStyle = slidePose ? "#f3e3ab" : pose.startsWith("BICICLETA") || pose === "TIRO" || pose === "VOLEA" || pose === "CHILENA" ? "#f6f2a5" : pose === "RULETA" ? "#ffb369" : "#a5f7ef";
          ctx.lineWidth = 2;
          ctx.beginPath();
          if (pose.startsWith("BICICLETA")) {
            ctx.ellipse(player.x + player.dirX * 12, player.y + player.dirY * 7, 13, 7, state.motionTime * 4, Math.PI, Math.PI * 1.9);
          } else if (pose === "VOLEA" || pose === "CHILENA") {
            ctx.ellipse(player.x + player.dirX * 15, player.y + player.dirY * 8 - kickHeight * 0.55, pose === "CHILENA" ? 21 : 16, 7, Math.atan2(player.dirY, player.dirX), 0, Math.PI * 1.55);
          } else if (pose === "PASE_AEREO") {
            ctx.ellipse(player.x + player.dirX * 12, player.y + player.dirY * 7, 18, 7, Math.atan2(player.dirY, player.dirX), 0.1, Math.PI * 1.3);
          } else if (pose.startsWith("CONTROL")) {
            ctx.ellipse(player.x, player.y + 10, 19 + Math.sin(state.motionTime * 15) * 2, 8, 0, 0, Math.PI * 2);
          } else if (pose === "RULETA") {
            const angle = spinProgress * Math.PI * 2;
            const ballSideX = player.x;
            const ballSideY = player.y + 1;
            ctx.ellipse(ballSideX, ballSideY, 22, 12, 0, -Math.PI / 2, angle - Math.PI / 2);
            const arrowX = ballSideX + Math.cos(angle - Math.PI / 2) * 22;
            const arrowY = ballSideY + Math.sin(angle - Math.PI / 2) * 12;
            const arrowAngle = angle + Math.PI / 2;
            ctx.moveTo(arrowX, arrowY);
            ctx.lineTo(arrowX - Math.cos(arrowAngle - 0.6) * 6, arrowY - Math.sin(arrowAngle - 0.6) * 6);
            ctx.moveTo(arrowX, arrowY);
            ctx.lineTo(arrowX - Math.cos(arrowAngle + 0.6) * 6, arrowY - Math.sin(arrowAngle + 0.6) * 6);
          } else {
            ctx.ellipse(player.x + player.dirX * 10, player.y + player.dirY * 6, 16, 7, Math.atan2(player.dirY, player.dirX), 0.1, Math.PI * 1.7);
          }
          ctx.stroke();
          ctx.restore();
        }
        ctx.lineWidth = 3;
        ctx.strokeStyle = shirtColor;
        const armSwing = slidePose ? 12 : pose === "CHILENA" || pose === "VOLEA" || pose === "TIRO" ? -8 : pose.startsWith("PASE") ? 6 : chestControl ? -5 : pace > 25 ? stride * 0.65 : 0;
        ctx.beginPath();
        ctx.moveTo(player.x - 6, player.y - 6); ctx.lineTo(player.x - 11 - shoulderSwing, player.y + armSwing);
        ctx.moveTo(player.x + 6, player.y - 6); ctx.lineTo(player.x + 11 + shoulderSwing, player.y - armSwing);
        ctx.stroke();
        ctx.save();
        ctx.globalAlpha = 0.8;
        ctx.strokeStyle = player.side === 0 ? "#dffdfd" : "#ffd1a8";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(player.x - 8, player.y - 5); ctx.lineTo(player.x - 14 + armSwing * 0.7, player.y - 3 + armSwing * 0.4);
        ctx.moveTo(player.x + 8, player.y - 5); ctx.lineTo(player.x + 14 - armSwing * 0.7, player.y - 3 - armSwing * 0.4);
        ctx.stroke();
        ctx.restore();
        ctx.fillStyle = "#e8c39b";
        ctx.fillRect(Math.round(player.x - 12), Math.round(player.y + armSwing - 1), 4, 4);
        ctx.fillRect(Math.round(player.x + 8), Math.round(player.y - armSwing - 1), 4, 4);
        ctx.fillStyle = palette.dark;
        ctx.fillRect(Math.round(player.x - 7), Math.round(player.y - 7), 14, 17);
        ctx.fillStyle = player.side === 0 ? "#183f47" : "#542a24";
        ctx.fillRect(Math.round(player.x - 7), Math.round(player.y + 3), 14, 7);
        ctx.fillStyle = "#f3ead0";
        ctx.fillRect(Math.round(player.x - 6), Math.round(player.y + 4), 12, 2);
        ctx.fillStyle = shirtColor;
        ctx.fillRect(Math.round(player.x - 7), Math.round(player.y - 8), 14, 12);
        ctx.fillStyle = palette.glow;
        ctx.fillRect(Math.round(player.x - 5), Math.round(player.y - 7), 2, 9);
        ctx.fillRect(Math.round(player.x + 3), Math.round(player.y - 7), 2, 9);
        ctx.fillStyle = "#ffffff66";
        ctx.fillRect(Math.round(player.x - 6), Math.round(player.y - 6), 1, 7);
        ctx.fillStyle = "#f5efd8";
        ctx.fillRect(Math.round(player.x - 2), Math.round(player.y - 7), 4, 2);
        ctx.fillStyle = "#f2c795";
        ctx.fillRect(Math.round(player.x - 5), Math.round(player.y - 17), 10, 9);
        ctx.fillStyle = "#18211d";
        ctx.fillRect(Math.round(player.x + (player.dirX >= 0 ? 1 : -3)), Math.round(player.y - 13), 2, 2);
        ctx.fillStyle = player.side === 0 ? "#163943" : "#5c2924";
        ctx.fillRect(Math.round(player.x - 6), Math.round(player.y - 18), 12, 4);
        ctx.fillStyle = player.side === 0 ? "#38666a" : "#814438";
        ctx.fillRect(Math.round(player.x - 4), Math.round(player.y - 20), 8, 2);
        ctx.fillStyle = "#f2c795";
        ctx.fillRect(Math.round(player.x - 4), Math.round(player.y - 11), 2, 2);
        if (isGoalkeeper) {
          ctx.fillStyle = "#f5efd8";
          ctx.fillRect(Math.round(player.x - 12), Math.round(player.y - 4), 4, 5);
          ctx.fillRect(Math.round(player.x + 8), Math.round(player.y - 4), 4, 5);
        }
        ctx.fillStyle = "#f4edcf";
        ctx.font = "bold 8px Courier New";
        ctx.textAlign = "center";
        ctx.fillText(String(player.index + 1), player.x, player.y + 2);
        if (player.control) {
          const controlLabel = player.control === "TALÓN" ? "TACÓN" : player.control;
          ctx.fillStyle = "#172421e8";
          ctx.fillRect(Math.round(player.x - 26), Math.round(player.y - 34), 52, 12);
          ctx.fillStyle = "#f3ff9b";
          ctx.font = "bold 8px Courier New";
          ctx.fillText(controlLabel, player.x, player.y - 25);
        }
        if (state.setPiece && state.setPiece.takerId === player.id) {
          ctx.fillStyle = "#fff4a8";
          ctx.font = "bold 9px Courier New";
          ctx.fillText(state.setPiece.kind === "SAQUE DE ARCO" ? "ARQUERO" : "EJECUTOR", player.x, player.y - 25);
          ctx.beginPath();
          ctx.moveTo(player.x - 3, player.y - 21);
          ctx.lineTo(player.x + 3, player.y - 21);
          ctx.lineTo(player.x, player.y - 17);
          ctx.fill();
        }
        ctx.restore();
        ctx.restore();
      }

      function drawPassTarget() {
        if (!state.charge || !["pass", "diagonalPass"].includes(state.charge.mode)) return;
        const passer = playerById(state.charge.playerId);
        const isWPass = state.charge.mode === "diagonalPass";
        const isAerial = isWPass && performance.now() - state.charge.started >= 320;
        const target = passer && nearestTeammate(passer, false, isWPass && !isAerial);
        if (!target) return;
        const pulse = 1 + Math.sin(state.motionTime * 10) * 0.08;
        ctx.save();
        ctx.setLineDash([6, 5]);
        ctx.lineWidth = 2;
        ctx.strokeStyle = "#e7ff83";
        ctx.globalAlpha = 0.8;
        ctx.beginPath();
        ctx.moveTo(state.ball.x, state.ball.y);
        ctx.lineTo(target.x, target.y);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.globalAlpha = 1;
        ctx.beginPath();
        ctx.ellipse(target.x, target.y, 20 * pulse, 14 * pulse, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = "#f3ff9b";
        ctx.font = "bold 9px Courier New";
        ctx.textAlign = "center";
        ctx.fillText("RECIBE", target.x, target.y - 22);
        ctx.restore();
      }

      function drawBall() {
        const ball = state.ball;
        const speed = Math.hypot(ball.vx, ball.vy);
        const lift = Math.max(0, ball.z || 0);
        const technique = ball.lastTechnique || "";
        const specialColors = {
          "VOLEA": "#ffd36a",
          "CHILENA": "#fff38b",
          "RABONA": "#ff8ebd",
          "TACONAZO": "#80f2d5",
          "VASELINA": "#c49aff"
        };
        const trailColor = specialColors[technique] || (ball.lastAction === "shot" ? "#ff765c" : "#9ef1ee");
        if (speed > 5) {
          ctx.save();
          ctx.globalAlpha = Math.min(0.7, speed / 28);
          ctx.strokeStyle = trailColor;
          ctx.lineWidth = specialColors[technique] ? 4 : ball.lastAction === "shot" ? 3 : 2;
          ctx.beginPath();
          ctx.moveTo(ball.x - ball.vx * 1.15, ball.y - ball.vy * 1.15 - lift);
          ctx.lineTo(ball.x - ball.vx * 0.35, ball.y - ball.vy * 0.35 - lift);
          ctx.stroke();
          if (specialColors[technique]) {
            ctx.globalAlpha *= 0.55;
            ctx.beginPath();
            ctx.moveTo(ball.x - ball.vx * 1.55, ball.y - ball.vy * 1.55 - lift - 3);
            ctx.lineTo(ball.x - ball.vx * 0.75, ball.y - ball.vy * 0.75 - lift - 3);
            ctx.stroke();
          }
          ctx.restore();
        }
        ctx.fillStyle = "#0c1715cc";
        ctx.beginPath(); ctx.ellipse(ball.x + 2, ball.y + 4, 6.8, 3.2, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#f7f0d6";
        ctx.fillRect(Math.round(ball.x - 4), Math.round(ball.y - 4 - lift), 8, 8);
        ctx.fillStyle = "#d9d0ae";
        ctx.fillRect(Math.round(ball.x - 3), Math.round(ball.y - 3 - lift), 6, 2);
        ctx.fillStyle = "#29352e";
        ctx.fillRect(Math.round(ball.x - 1), Math.round(ball.y - 1 - lift), 3, 3);
      }

      function drawHud() {
        roundedRect(370, 10, 220, 42, 4, "#162321ee", "#89a180");
        ctx.fillStyle = "#41d9e6";
        ctx.font = "bold 22px Courier New";
        ctx.textAlign = "right";
        ctx.fillText(String(state.score[0]).padStart(2, "0"), 445, 39);
        ctx.fillStyle = "#f5efd8";
        ctx.textAlign = "center";
        ctx.font = "bold 13px Courier New";
        ctx.fillText(formatTime(state.time), 480, 37);
        ctx.fillStyle = "#ff7d4c";
        ctx.textAlign = "left";
        ctx.font = "bold 22px Courier New";
        ctx.fillText(String(state.score[1]).padStart(2, "0"), 515, 39);

        const player = activePlayer();
        if (state.charge && player) {
          const amount = clamp((performance.now() - state.charge.started) / state.charge.max, 0, 1);
          roundedRect(386, 505, 188, 12, 3, "#1b2926", "#d4e6b1");
          ctx.fillStyle = state.charge.mode === "shot" ? (amount > 0.8 ? "#ff5757" : "#ff9c51") : "#62e4ef";
          ctx.fillRect(390, 509, 180 * amount, 4);
          ctx.fillStyle = "#f5efd8";
          ctx.textAlign = "center";
          ctx.font = "bold 10px Courier New";
          ctx.fillText(state.charge.mode === "shot" ? "TIRO" : state.charge.mode === "diagonalPass" ? "PASE W" : "PASE", 480, 500);
        } else if (state.specialCharge && player) {
          const amount = clamp((performance.now() - state.specialCharge.started) / 700, 0, 1);
          const isShot = performance.now() - state.specialCharge.started >= 280;
          roundedRect(386, 505, 188, 12, 3, "#1b2926", "#ffc071");
          ctx.fillStyle = isShot ? "#ff795f" : "#67e3e8";
          ctx.fillRect(390, 509, 180 * amount, 4);
          ctx.fillStyle = "#fff1b8";
          ctx.fillRect(390 + 180 * 0.4, 506, 2, 10);
          ctx.fillStyle = "#f5efd8";
          ctx.textAlign = "center";
          ctx.font = "bold 10px Courier New";
          const technique = state.specialCharge.key === "r" ? "RABONA" : "TACÓN";
          ctx.fillText(technique + (isShot ? " · TIRO" : " · PASE"), 480, 500);
        }
        if (state.messageTime > 0) {
          roundedRect(240, 82, 480, 35, 3, "#111c1de8", "#d8f36a");
          ctx.fillStyle = "#f5efd8";
          ctx.font = "bold 13px Courier New";
          ctx.textAlign = "center";
          ctx.fillText(state.message, 480, 105);
        }
        if (state.trickTime > 0) {
          ctx.fillStyle = "#f5efd8";
          ctx.font = "bold 14px Courier New";
          ctx.textAlign = "center";
          ctx.fillText(state.trickText, 480, 135);
        }
        if (state.phase === "setpiece") {
          roundedRect(324, 246, 312, 62, 4, "#15201feF", "#ffcb66");
          ctx.fillStyle = "#ffcb66";
          ctx.textAlign = "center";
          ctx.font = "bold 17px Courier New";
          ctx.fillText(state.setPiece ? state.setPiece.kind : "BALÓN PARADO", 480, 272);
          ctx.fillStyle = "#f5efd8";
          ctx.font = "12px Courier New";
          const setup = state.setPiece;
          const prompt = setup && setup.side === 1
            ? "REANUDACIÓN CPU..."
            : canShootSetPiece(setup) ? "Z PASE · MANTÉN X PARA TIRAR" : "PULSA Z PARA SACAR";
          ctx.fillText(prompt, 480, 292);
        }
        if (state.gameOver) {
          ctx.fillStyle = "#081111bb";
          ctx.fillRect(field.left, 190, field.right - field.left, 160);
          ctx.fillStyle = "#d8f36a";
          ctx.textAlign = "center";
          ctx.font = "bold 27px Courier New";
          ctx.fillText("FIN DEL PARTIDO", 480, 245);
          ctx.fillStyle = "#f5efd8";
          ctx.font = "bold 17px Courier New";
          ctx.fillText(state.score[0] === state.score[1] ? "EMPATE" : state.score[0] > state.score[1] ? "¡VICTORIA!" : "GANA LA CPU", 480, 278);
          ctx.font = "12px Courier New";
          ctx.fillText("ENTER O NUEVO PARTIDO", 480, 309);
        }
      }

      function formatTime(seconds) {
        const minutes = Math.floor(seconds / 60);
        const remaining = Math.ceil(seconds % 60);
        return String(minutes).padStart(2, "0") + ":" + String(remaining).padStart(2, "0");
      }

      function render() {
        drawField();
        const ordered = [...state.players].sort((a, b) => a.y - b.y);
        ordered.forEach(drawPlayer);
        drawPassTarget();
        drawBall();
        drawHud();
      }

      function frame(timestamp) {
        const dt = state.lastTime ? Math.min((timestamp - state.lastTime) / 1000, 0.04) : 0;
        state.lastTime = timestamp;
        update(dt);
        render();
        requestAnimationFrame(frame);
      }

      window.addEventListener("keydown", event => {
        const key = event.key === " " ? " " : event.key.length === 1 ? event.key.toLowerCase() : event.key;
        if (key === "Escape") {
          event.preventDefault();
          if (state.practice) {
            finishPractice();
          } else if (state.paused) {
            if (state.overlay === "pause") { state.paused = false; hideOverlay(); }
            else if (state.overlay === "practice-intro") showControls();
          } else pauseGame();
          return;
        }
        if (state.paused || state.exited) return;
        if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " ", "Tab"].includes(key)) event.preventDefault();
        if (key === " ") {
          if (!keys.has(key)) {
            keys.add(key);
            if (!state.paused && !state.exited) switchPlayer();
          }
          return;
        }
        if (!keys.has(key)) {
          keys.add(key);
          const carrier = owner();
          const preparingPracticeReception = state.practice && state.practiceStep >= 5 && state.practiceStep <= 7;
          if (carrier && carrier.side === 0 && !preparingPracticeReception &&
            ["c", "a", "s", "d", "e", "f", "v", "y", "p", "o", "i"].includes(key)) {
            state.selected = carrier.id;
          }
          if (key === "x" || key === "z" || key === "w") startCharge(key);
          else if ((key === "r" || key === "t") && owner() && owner().side === 0 &&
            !(state.practice && state.practiceStep >= 5 && state.practiceStep <= 7 && key === "r")) specialChargeStart(key);
          else if (!["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Shift"].includes(key)) pressed.push(key);
        }
      });
      window.addEventListener("keyup", event => {
        const key = event.key === " " ? " " : event.key.length === 1 ? event.key.toLowerCase() : event.key;
        keys.delete(key);
        if (key === "x" || key === "z" || key === "w") endCharge(key);
        if (key === "r" || key === "t") specialChargeEnd(key);
      });
      window.addEventListener("blur", () => {
        keys.clear();
        if (state.charge) endCharge(state.charge.key);
        state.specialCharge = null;
      });
      document.getElementById("restart").addEventListener("click", restartMatch);
      document.getElementById("pause-button").addEventListener("click", () => {
        if (state.paused && state.overlay === "pause") { state.paused = false; hideOverlay(); }
        else if (!state.paused) pauseGame();
      });
      teamSelect.addEventListener("change", restartMatch);

      createTeams(state.count);
      showTutorial();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
