<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto — AngelTraz</title>
    <meta name="description" content="Formulario de contacto de AngelTraz.">
    <!-- Bootstrap solo se usa aquí, para la rejilla de 12 columnas del formulario -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- ENCABEZADO -->
    <header class="header">
        <div class="logo">AngelTraz</div>
        <nav class="nav">
            <a href="../index.html">Inicio</a>
            <a href="blog.html">Blog</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>

    <main>

        <!-- CONTACTO -->
        <section class="contacto">

            <h1>Contacto</h1>
            <p>
                ¿Tienes un proyecto en mente? Cuéntame los detalles y te
                responderé lo antes posible.
            </p>

            <form class="container">
                <div class="row">

                    <div class="col-md-6">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label for="correo">Correo electrónico</label>
                        <input type="email" id="correo" name="correo" class="form-control" required>
                    </div>

                    <div class="col-md-12">
                        <label for="asunto">Asunto</label>
                        <input type="text" id="asunto" name="asunto" class="form-control" required>
                    </div>

                    <div class="col-md-12">
                        <label for="mensaje">Mensaje</label>
                        <textarea id="mensaje" name="mensaje" class="form-control" required></textarea>
                    </div>

                    <div class="col-md-12">
                        <button type="submit">Enviar</button>
                    </div>

                </div>
            </form>

        </section>

    </main>

    <!-- PIE DE PÁGINA -->
    <footer class="footer">
        <p>&copy; 2026 AngelTraz</p>
    </footer>

</body>
</html>
